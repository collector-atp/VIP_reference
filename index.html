<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Reference ATP</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,body{
            width:100%;
            height:100%;
            overflow:hidden;
            background:#f4f6f9;
            font-family:Arial, Helvetica, sans-serif;
        }

        iframe{
            width:100%;
            height:100vh;
            border:none;
            display:block;
        }

        .loading{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            font-size:18px;
            color:#555;
        }
    </style>
</head>

<body>

<div class="loading">Loading Application...</div>

<iframe
    src="https://script.google.com/macros/s/AKfycbzetu_9O5oPFSg8BUaIyXTm3nKmvR_J25jL6m730oNg2EeDDLSssmtCFPW4n3yzjOQ5gg/exec"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
    onload="document.querySelector('.loading').style.display='none';">
</iframe>

</body>
</html>
