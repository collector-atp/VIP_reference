<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Referenceatp</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        html,body{
            width:100%;
            height:100%;
            overflow:hidden;
            background:#f4f6f9;
            font-family:Arial, Helvetica, sans-serif;
        }
        iframe{
            width:100%;
            height:100vh;
            border:none;
            display:block;
        }
        .loading{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            font-size:18px;
            color:#555;
        }
    </style>
</head>
<body>
<div class="loading">Loading Application...</div>

<!-- Give the iframe an ID and remove the hardcoded src -->
<iframe
    id="appFrame"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"
    onload="document.querySelector('.loading').style.display='none';">
</iframe>

<script>
    // Dynamically set the URL with a timestamp to prevent browser caching
    const baseUrl = "https://script.google.com/macros/s/AKfycbzak06D74OFe_lUiMRuRGMnohMtinr8FNz13oZe-lpHgXPgbAp7fqVtRSeUon4qpNK9/exec";
    const iframe = document.getElementById("appFrame");
    iframe.src = baseUrl + "?t=" + new Date().getTime();
</script>

</body>
</html>
